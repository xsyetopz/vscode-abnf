name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.2.3) to package and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          if ! git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"; then
            echo "Release tag is not a valid Git ref: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out_commit" ]]; then
            echo "Checked out commit does not match release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bunx biome check . --max-diagnostics 16384

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Package extension
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-bnf-intellisense-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" ./*.vsix --generate-notes --verify-tag
